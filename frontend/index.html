<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriPulse - Smart Fitness & Nutrition Tracking</title>
    <meta name="description" content="Intelligent calorie, macro, workout, and hydration tracking built for sustainable health and peak performance." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NutriPulse" />
    <meta property="og:title" content="NutriPulse - Smart Fitness & Nutrition Tracking" />
    <meta property="og:description" content="Precision calorie, macronutrient, hydration, and progressive resistance workout tracking designed for sustainable health." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NutriPulse - Smart Fitness & Nutrition Tracking" />
    <meta name="twitter:description" content="Precision calorie, macronutrient, hydration, and progressive resistance workout tracking." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#10b981" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Immediate theme execution to prevent any theme flash -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('nutripulse_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
